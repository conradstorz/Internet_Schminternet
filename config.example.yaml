# config.example.yaml
# Copy this file to config.yaml and fill in your values.
# config.yaml is gitignored — never commit it (it contains credentials).

monitors:
  ping:
    targets:
      - "8.8.8.8"       # Google DNS
      - "1.1.1.1"       # Cloudflare DNS
      # - "192.168.1.1" # Your router gateway (uncomment and adjust)
    interval_seconds: 30
    count: 5
    # Degraded alerting (opt-in): omit both keys to disable it for this monitor.
    # Either threshold fires on its own; with both set, whichever is crossed first wins.
    # degraded_alert_minutes: 10   # Alert after 10 minutes continuously degraded
    # degraded_alert_cycles: 5     # ...or after 5 consecutive degraded polls
    thresholds:
      degraded_ms: 100
      down_ms: 500
      loss_degraded_pct: 10
      loss_down_pct: 50

  dns:
    servers:
      - "8.8.8.8"    # Google DNS
      - "1.1.1.1"    # Cloudflare DNS
    test_domain: "google.com"
    interval_seconds: 60
    # Degraded alerting (opt-in) — see the ping section above for details.
    # degraded_alert_minutes: 5     # Minutes alone is enough; cycles may stay unset
    thresholds:
      degraded_ms: 200
      down_ms: 1000

  speedtest:
    interval_seconds: 1800   # 30 minutes — don't run too often on Pi 3B
    expected_download_mbps: 50
    expected_upload_mbps: 10
    # Degraded alerting (opt-in) — see the ping section above for details.
    # degraded_alert_cycles: 3      # Cycles alone is enough; minutes may stay unset
    thresholds:
      degraded_ratio: 0.5    # Below 50% of expected = degraded

  http:
    targets:
      - url: "https://www.google.com"
      - url: "https://www.cloudflare.com"
      # Add any URLs you want to check reachability for
    interval_seconds: 120
    timeout_seconds: 10
    # Degraded alerting (opt-in) — see the ping section above for details.
    # degraded_alert_minutes: 10
    # degraded_alert_cycles: 5
    thresholds:
      degraded_ms: 1000

  ip:
    interval_seconds: 300    # Check for IP changes every 5 minutes
    # ip's "degraded" lasts exactly one poll (set only on the poll where the
    # external IP changed; the next poll is back to "ok"), so any
    # degraded_alert_cycles above 1, and any degraded_alert_minutes, can
    # never be reached — only degraded_alert_cycles: 1 (alerting on every
    # single IP change) would ever fire.

database:
  path: "data/schminternet.db"
  retention_days: 30         # Keep 30 days of history

web:
  host: "0.0.0.0"            # Listen on all interfaces (accessible from LAN)
  port: 8080

leds:
  enabled: true              # Set false when running without hardware
  pin: 18                    # GPIO18 (PWM0) — disable onboard audio if conflict
  count: 16                  # Total number of LEDs on your strip
  brightness: 0.4            # 0.0 – 1.0
  segments:
    # Each value is [first_led_index, last_led_index] (inclusive, 0-based)
    ping:      [0, 3]
    dns:       [4, 6]
    http:      [7, 9]
    speedtest: [10, 12]
    ip:        [13, 13]
    overall:   [14, 15]

logging:
  path: "data/schminternet.log"  # rotating logfile; relative to the working directory
  level: "INFO"
  max_bytes: 10000000        # rotate at ~10 MB
  backup_count: 5            # keep 5 rotated files
  console: true               # also log to stdout (docker logs / journald)

alerts:
  email:
    enabled: false            # Set true to enable email alerts
    smtp_host: "smtp.gmail.com"
    smtp_port: 587
    use_tls: true
    username: "you@gmail.com"
    password: "your-app-password"  # Use a Gmail App Password, NOT your account password
    from_addr: "you@gmail.com"
    to_addrs:
      - "you@gmail.com"
    cooldown_minutes: 15      # Min time between repeat alerts for the same monitor
