# config.example.yaml
# Copy this file to config.yaml and fill in your values.
# config.yaml is gitignored — never commit it (it contains credentials).

monitors:
  ping:
    # Deliberately disjoint from monitors.dns.servers below: if ping and DNS
    # shared targets, one unreachable host would fail both monitors
    # identically and neither result would be independent evidence.
    targets:
      - "1.1.1.1"        # Cloudflare anycast — nearest PoP, the optimistic baseline.
                          # A raw IP on purpose: the hostname targets below need DNS
                          # to resolve before ICMP can even be sent, so if they fail
                          # while this one stays healthy, that pattern points at a
                          # DNS problem rather than a connectivity problem.
      - "wikipedia.org"   # Popular site on real origin hosting (not a nearby CDN edge)
      - "kernel.org"      # Less popular, longer path — exercises a different route
      # - "192.168.1.1" # Your router gateway (uncomment and adjust)
    interval_seconds: 30
    count: 5
    # Degraded alerting (opt-in): omit both keys to disable it for this monitor.
    # Either threshold fires on its own; with both set, whichever is crossed first wins.
    # degraded_alert_minutes: 10   # Alert after 10 minutes continuously degraded
    # degraded_alert_cycles: 5     # ...or after 5 consecutive degraded polls
    thresholds:
      degraded_ms: 100
      down_ms: 500
      loss_degraded_pct: 10
      loss_down_pct: 50

  dns:
    # Deliberately disjoint from monitors.ping.targets above — see the note there.
    servers:
      - "8.8.8.8"    # Google DNS
      - "9.9.9.9"    # Quad9 DNS
    test_domain: "google.com"
    # A popular domain like google.com is cached by almost every resolver, so
    # querying it verbatim every poll would just time a cache hit. With
    # randomize_query left true (the default), a fresh random label is
    # prefixed to the domain on every query (e.g. "a3f9c1d2.google.com"),
    # which can never be cached — the resolver has to do real work. The
    # resulting NXDOMAIN is expected and still counts as a successful, timed
    # round trip. Set false to query test_domain verbatim instead.
    randomize_query: true
    interval_seconds: 60
    # Degraded alerting (opt-in) — see the ping section above for details.
    # degraded_alert_minutes: 5     # Minutes alone is enough; cycles may stay unset
    thresholds:
      degraded_ms: 200
      down_ms: 1000

  speedtest:
    # Measures against speed.cloudflare.com (nearest Cloudflare edge).
    # Set this to the speed your plan advertises: with the default 0 the
    # fixed threshold is off entirely, leaving only the rolling-mean rule
    # below to drive the ladder (and _determine_status always "ok").
    expected_download_mbps: 50
    expected_upload_mbps: 10
    # Degraded alerting (opt-in) — see the ping section above for details.
    # degraded_alert_cycles: 3      # Cycles alone is enough; minutes may stay unset
    # For speedtest, a "cycle" is one poll and the poll interval now moves
    # with the ladder below (30 min at calm, 1 min at investigate), so a
    # cycle count means a different amount of wall time at every rung.
    # Prefer degraded_alert_minutes here.
    thresholds:
      degraded_ratio: 0.5    # Below 50% of expected = degraded
    streams: 4               # concurrent transfers per direction; same at every rung
    timeout_seconds: 60      # total deadline for the download phase and again for
                             # the upload phase (not per request). On expiry the
                             # streams are cut short and the bytes that did move are
                             # reported over the elapsed time, so a link too slow to
                             # finish reads as slow instead of down.
    # Adaptive cadence. Starts at rung 1 ("watch"). A poor run climbs one
    # rung; `calm_after` consecutive good runs descend one. A run is poor
    # when download < expected * degraded_ratio, or < avg_ratio * the mean
    # of the last 24 h (once min_samples readings exist).
    # Data per run = streams * (download_bytes + upload_bytes). Held all day:
    #   calm 2.7 GB, watch 16 GB, alert 100 GB, investigate 200 GB.
    # Cloudflare refuses download_bytes above 50000000. Overriding `ladder`
    # replaces the whole list (lists are not deep-merged).
    adaptive:
      avg_ratio: 0.8
      min_samples: 3
      calm_after: 2
      ladder:
        - { name: calm,        interval_seconds: 1800, download_bytes: 10000000, upload_bytes: 4000000 }
        - { name: watch,       interval_seconds: 300,  download_bytes: 10000000, upload_bytes: 4000000 }
        - { name: alert,       interval_seconds: 120,  download_bytes: 25000000, upload_bytes: 10000000 }
        - { name: investigate, interval_seconds: 60,   download_bytes: 25000000, upload_bytes: 10000000 }

  http:
    targets:
      - url: "https://www.google.com"
      - url: "https://www.cloudflare.com"
      # Add any URLs you want to check reachability for
    interval_seconds: 120
    timeout_seconds: 10
    # Degraded alerting (opt-in) — see the ping section above for details.
    # degraded_alert_minutes: 10
    # degraded_alert_cycles: 5
    thresholds:
      degraded_ms: 1000

  ip:
    interval_seconds: 300    # Check for IP changes every 5 minutes
    # ip's "degraded" lasts exactly one poll (set only on the poll where the
    # external IP changed; the next poll is back to "ok"), so any
    # degraded_alert_cycles above 1, and any degraded_alert_minutes, can
    # never be reached — only degraded_alert_cycles: 1 (alerting on every
    # single IP change) would ever fire.

database:
  path: "data/schminternet.db"
  retention_days: 30         # Keep 30 days of history

web:
  host: "0.0.0.0"            # Listen on all interfaces (accessible from LAN)
  port: 8080

leds:
  enabled: true              # Set false when running without hardware
  pin: 18                    # GPIO18 (PWM0) — disable onboard audio if conflict
  count: 16                  # Total number of LEDs on your strip
  brightness: 0.4            # 0.0 – 1.0
  # Rank-sorted quality strip: `leds.segments` (fixed per-monitor index
  # ranges) is gone. Instead every scored monitor gets a slot sized as
  # evenly as `count` allows, and slots are re-sorted on every poll —
  # greenest (best score) nearest the top, reddest nearest the bottom. A
  # fixed mapping made no sense once the strip re-orders itself, and the
  # owner never has to edit index ranges when adding/removing a monitor.
  # "ip" is never scored or slotted — an address change is an event, not a
  # measure of connection quality — so it never appears on the strip.
  weights:
    # Used by overall_score() to combine each monitor's 0.0-1.0 score into
    # one number for the optional "overall" slot below. speedtest is
    # deliberately downweighted: it runs on an adaptive interval (see
    # monitors.speedtest.adaptive.ladder), so a stale or failed run should
    # tint the overall colour rather than dominate it.
    ping: 1.0
    dns: 1.0
    http: 1.0
    speedtest: 0.25
  orientation: top_down       # or "bottom_up" — matches how the strip is physically
                               # mounted, so the owner never has to rewire it. Index 0
                               # is the top under top_down; the highest index is the
                               # top under bottom_up.
  overall: true                # Show a combined-score slot at the bottom end of the
                                # strip (does not participate in the ranking/sorting).
  animation:
    # A gentle brightness "breathe" so the strip visibly moves between
    # polls. Between a ping poll (30 s) and a speedtest (minutes apart) the strip
    # would otherwise sit perfectly still, which looks exactly like a
    # crashed service or a powered-off Pi. The animation is a liveness
    # signal only — it is identical on every slot regardless of score,
    # because colour already tells you the quality.
    enabled: true
    period_seconds: 4.0      # seconds for one full swell-and-dip cycle
    min_brightness: 0.7      # dimmest point as a FRACTION of `brightness` above,
                             # not an absolute value — 0.7 means 70% of 0.4
    fps: 25                  # animation frames per second

logging:
  path: "data/schminternet.log"  # rotating logfile; relative to the working directory
  level: "INFO"
  max_bytes: 10000000        # rotate at ~10 MB
  backup_count: 5            # keep 5 rotated files
  console: true               # also log to stdout (docker logs / journald)

alerts:
  email:
    enabled: false            # Set true to enable email alerts
    smtp_host: "smtp.gmail.com"
    smtp_port: 587
    use_tls: true
    username: "you@gmail.com"
    password: "your-app-password"  # Use a Gmail App Password, NOT your account password
    from_addr: "you@gmail.com"
    to_addrs:
      - "you@gmail.com"
    cooldown_minutes: 15      # Min time between repeat alerts for the same monitor
