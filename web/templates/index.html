<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Internet Schminternet</title>

  <!-- Chart.js + Luxon time-axis adapter (served from CDN; cached after first load) -->
  <script src="https://cdn.jsdelivr.net/npm/luxon@3.5.0/build/global/luxon.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-luxon@1.3.1/dist/chartjs-adapter-luxon.umd.min.js"></script>

  <style>
    :root {
      --ok:        #22c55e;
      --degraded:  #f59e0b;
      --down:      #ef4444;
      --unknown:   #6b7280;
      --measuring: #3b82f6;
      --bg:        #0f172a;
      --surface:   #1e293b;
      --border:    #334155;
      --text:      #f1f5f9;
      --muted:     #94a3b8;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
      padding: 1.5rem;
      min-height: 100vh;
    }

    /* ── Header ── */
    .header { margin-bottom: 1.5rem; }
    .header h1 { font-size: 1.6rem; font-weight: 700; }
    .subtitle { color: var(--muted); font-size: 0.875rem; margin-top: 0.25rem; display: flex; align-items: center; gap: 0.5rem; }

    .live-dot {
      display: inline-block; width: 9px; height: 9px;
      background: var(--ok); border-radius: 50%;
      animation: pulse 2s infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.25} }

    /* ── Status cards ── */
    .status-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .status-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      padding: 1.2rem;
      transition: border-color 0.3s;
    }
    .status-card.ok       { border-color: var(--ok); }
    .status-card.degraded { border-color: var(--degraded); }
    .status-card.down     { border-color: var(--down); }

    .card-label {
      font-size: 0.7rem; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.06em;
      color: var(--muted); margin-bottom: 0.6rem;
    }

    .badge {
      display: inline-block;
      padding: 0.15rem 0.65rem;
      border-radius: 9999px;
      font-size: 0.7rem; font-weight: 700;
      text-transform: uppercase;
    }
    .badge.ok        { background: rgba(34,197,94,.15);  color: var(--ok); }
    .badge.degraded  { background: rgba(245,158,11,.15); color: var(--degraded); }
    .badge.down      { background: rgba(239,68,68,.15);  color: var(--down); }
    .badge.measuring { background: rgba(59,130,246,.15); color: var(--measuring); }
    .badge.unknown   { background: rgba(107,114,128,.15);color: var(--unknown); }

    .metric-value { font-size: 1.6rem; font-weight: 700; margin: 0.4rem 0 0.1rem; }
    .metric-unit  { font-size: 0.7rem; color: var(--muted); }

    /* ── Charts ── */
    .charts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
      gap: 1.25rem;
      margin-bottom: 2rem;
    }

    .chart-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      padding: 1.2rem;
    }
    .chart-card h3 { font-size: 0.8rem; font-weight: 600; color: var(--muted); margin-bottom: 0.75rem; }
    .chart-wrapper { position: relative; height: 190px; }

    /* ── Events log ── */
    .events-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      padding: 1.2rem;
    }
    .events-card h3 { font-size: 0.875rem; font-weight: 600; margin-bottom: 0.75rem; }

    /* ── Events timeline ── */
    .timeline-controls {
      display: flex; align-items: center; gap: 0.5rem;
      margin-bottom: 0.75rem; flex-wrap: wrap;
    }
    .timeline-controls button {
      background: var(--bg); color: var(--text); border: 1px solid var(--border);
      border-radius: 0.4rem; padding: 0.3rem 0.7rem; font-size: 0.8rem; cursor: pointer;
    }
    .timeline-controls button:hover { border-color: var(--muted); }
    .timeline-range { color: var(--muted); font-size: 0.78rem; margin-left: auto; }
    .timeline-range.live::before    { content: "LIVE — ";       color: var(--ok);       font-weight: 700; }
    .timeline-range.historical::before { content: "HISTORICAL — "; color: var(--degraded); font-weight: 700; }

    .timeline-wrapper {
      position: relative;
      height: 84px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      overflow: hidden;
      cursor: grab;
      user-select: none;
      touch-action: pan-y;
    }
    .timeline-wrapper.dragging { cursor: grabbing; }

    .timeline-axis {
      position: absolute; left: 0; right: 0; top: 38%;
      height: 1px; background: var(--border);
    }
    .timeline-track { position: absolute; left: 0; right: 0; top: 0; bottom: 20px; }

    .timeline-marker {
      position: absolute; top: 38%; width: 10px; height: 10px;
      border-radius: 50%; transform: translate(-50%, -50%);
      border: 2px solid var(--surface);
      cursor: pointer;
    }
    .timeline-marker.cluster {
      width: 18px; height: 18px;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.6rem; font-weight: 700; color: var(--bg);
    }

    .timeline-ticks {
      position: absolute; left: 0; right: 0; bottom: 0; height: 20px;
    }
    .timeline-tick {
      position: absolute; bottom: 13px; width: 1px; height: 6px;
      background: var(--border);
    }
    .timeline-tick-label {
      position: absolute; bottom: 0; transform: translateX(-50%);
      font-size: 0.65rem; color: var(--muted); white-space: nowrap;
    }

    .timeline-empty {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      color: var(--muted); font-size: 0.8rem;
    }
    .timeline-empty[hidden] { display: none; }

    .timeline-tooltip {
      position: fixed;
      z-index: 50;
      max-width: 280px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      padding: 0.6rem 0.75rem;
      font-size: 0.78rem;
      line-height: 1.4;
      box-shadow: 0 4px 16px rgba(0,0,0,.4);
      pointer-events: none;
    }
    .timeline-tooltip .tt-event + .tt-event {
      margin-top: 0.5rem; padding-top: 0.5rem; border-top: 1px solid var(--border);
    }
    .timeline-tooltip .tt-time { color: var(--muted); }
    .timeline-tooltip .tt-transition { font-weight: 600; }
  </style>
</head>
<body>

  <!-- ── Header ── -->
  <div class="header">
    <h1>Internet Schminternet</h1>
    <p class="subtitle">
      <span class="live-dot" id="live-dot"></span>
      <span id="last-update">Connecting…</span>
    </p>
  </div>

  <!-- ── Status cards ── -->
  <div class="status-grid">

    <div class="status-card" id="card-ping">
      <div class="card-label">Ping / Latency</div>
      <span class="badge unknown" id="badge-ping">—</span>
      <div class="metric-value" id="val-ping">—</div>
      <div class="metric-unit">avg ms</div>
    </div>

    <div class="status-card" id="card-dns">
      <div class="card-label">DNS Resolution</div>
      <span class="badge unknown" id="badge-dns">—</span>
      <div class="metric-value" id="val-dns">—</div>
      <div class="metric-unit">avg ms</div>
    </div>

    <div class="status-card" id="card-http">
      <div class="card-label">HTTP Checks</div>
      <span class="badge unknown" id="badge-http">—</span>
      <div class="metric-value" id="val-http">—</div>
      <div class="metric-unit">avg ms</div>
    </div>

    <div class="status-card" id="card-speedtest">
      <div class="card-label">Speed Test</div>
      <span class="badge unknown" id="badge-speedtest">—</span>
      <div class="metric-value" id="val-speedtest">—</div>
      <div class="metric-unit">Mbps down</div>
    </div>

    <div class="status-card" id="card-ip">
      <div class="card-label">External IP</div>
      <span class="badge unknown" id="badge-ip">—</span>
      <div class="metric-value" id="val-ip" style="font-size:1rem;word-break:break-all">—</div>
      <div class="metric-unit">current address</div>
    </div>

  </div>

  <!-- ── Charts ── -->
  <div class="charts-grid">

    <div class="chart-card">
      <h3>Ping Latency — 24 h</h3>
      <div class="chart-wrapper"><canvas id="chart-ping"></canvas></div>
    </div>

    <div class="chart-card">
      <h3>DNS Resolution Time — 24 h</h3>
      <div class="chart-wrapper"><canvas id="chart-dns"></canvas></div>
    </div>

    <div class="chart-card">
      <h3>Download Speed — 24 h</h3>
      <div class="chart-wrapper"><canvas id="chart-speed"></canvas></div>
    </div>

  </div>

  <!-- ── Events timeline (12 h pannable window) ── -->
  <div class="events-card">
    <h3>Events Timeline</h3>
    <div class="timeline-controls">
      <button id="tl-back" type="button">&larr; Back 12h</button>
      <button id="tl-now" type="button">Now</button>
      <button id="tl-forward" type="button">Forward 12h &rarr;</button>
      <span id="tl-range" class="timeline-range live"></span>
    </div>
    <div class="timeline-wrapper" id="timeline-wrapper">
      <div class="timeline-axis"></div>
      <div class="timeline-track" id="timeline-track"></div>
      <div class="timeline-ticks" id="timeline-ticks"></div>
      <div class="timeline-empty" id="timeline-empty" hidden>No events in this window.</div>
    </div>
  </div>
  <div class="timeline-tooltip" id="timeline-tooltip" hidden></div>

  <script src="/static/main.js"></script>
</body>
</html>
