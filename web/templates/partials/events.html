{% if events %}
<table>
  <thead>
    <tr>
      <th>Time (UTC)</th>
      <th>Monitor</th>
      <th>Type</th>
      <th>Detail</th>
    </tr>
  </thead>
  <tbody>
    {% for ev in events %}
    <tr>
      <td>{{ ev.timestamp[:19].replace("T", " ") if ev.timestamp else "—" }}</td>
      <td>{{ ev.monitor }}</td>
      <td>
        <span class="badge {% if ev.new_status in ['ok', 'degraded', 'down'] %}{{ ev.new_status }}{% else %}unknown{% endif %}">
          {{ ev.event_type }}
        </span>
      </td>
      <td>{{ ev.description }}</td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% else %}
<p class="no-events">No events recorded yet.</p>
{% endif %}
