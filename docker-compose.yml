services:
  schminternet:
    build: .
    image: internet-schminternet:latest
    container_name: schminternet
    restart: unless-stopped
    # 8080 is taken on hpz440 (gte-admin) and 8090 gets claimed intermittently
    # by a Tailscale-bound service, so the dashboard is published on 8099
    # -> http://hpz440:8099
    ports:
      - "8099:8080"
    volumes:
      # SQLite history, the alert queue and the rotating logfile live on the
      # host, so `tail -f /opt/schminternet/data/schminternet.log` works without
      # going through Docker. Paths resolve on the DOCKER HOST, not on the
      # machine running the CLI.
      - /opt/schminternet/data:/app/data
      # Defaults in config.py are already correct for headless operation
      # (LEDs off, email off). To set SMTP credentials or thresholds, create
      # /opt/schminternet/config.yaml ON hpz440 and uncomment:
      # - /opt/schminternet/config.yaml:/app/config.yaml:ro
    # Graceful shutdown writes shutdown_at, so a restart is classified as clean.
    stop_grace_period: 30s
    labels:
      # Locally built image with no registry — nothing for watchtower to pull.
      com.centurylinklabs.watchtower.enable: "false"
